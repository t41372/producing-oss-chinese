name: Build Book

on:
  push:
    branches:
      - main
    paths:
      - 'book/zh/**'
      - 'scripts/build-book.sh'
      - 'docker/**'
      - '.github/workflows/build-book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-zh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build book (zh)
        run: |
          ./scripts/build-book.sh zh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: producingoss-zh
          path: |
            book/zh/producingoss*.html
            book/zh/producingoss*.epub
            book/zh/producingoss-*.pdf
            book/zh/html-chunk
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/zh/html-chunk

  deploy-pages:
    needs: build-zh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
